# Fly.io config for the DEMEX server. First deploy:
#   fly launch --no-deploy --copy-config   (accept the app name or change it)
#   fly volumes create demex_data --size 3
#   fly secrets set DEMEX_ACCESS_KEY="<pick a strong key>" ANTHROPIC_API_KEY="<your key>" DEMEX_ALLOWED_HOSTS="<app>.fly.dev"
#   fly deploy
app = "demex"
primary_region = "atl"

[build]

[env]
  DEMEX_BIND = "0.0.0.0"
  DEMEX_BRIDGE_PORT = "8080"
  DEMEX_DATA_DIR = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "demex_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
