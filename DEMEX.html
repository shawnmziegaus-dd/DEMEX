<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>DEMEX — Operations Cockpit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>/* theme: 'light' | 'dark' | unset (= follow the system). Set before first paint. */
try{var __t=localStorage.getItem('demex_theme');if(__t==='light'||__t==='dark')document.documentElement.setAttribute('data-theme',__t);}catch(e){}
</script>
<style>
  /* ---- design tokens (dark is the default; light via system preference or the toggle) ---- */
  :root{
    color-scheme:dark;
    --red:#e8332a;--red2:#ff5a4d;--teal:#2AD1B8;--teal2:#5fe3cf;
    --ink:#0b0b0c;--panel:#141416;--panel2:#1c1c1f;--panel3:#232327;
    --line:rgba(255,255,255,.10);--line2:rgba(255,255,255,.20);
    --t1:#ececee;--t2:#a2a2a6;--t3:#7c7c81;
    --green:#22c97a;--gold:#d4aa3c;--blue:#7db3ff;--purple:#c9a4ff;
    --onaccent:#fff;--hover:rgba(255,255,255,.045);--sel:rgba(42,209,184,.14);
    --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 8px 24px rgba(0,0,0,.28);
    --shadow-lg:0 24px 60px rgba(0,0,0,.55);
    --focus:#2AD1B8;--tip-bg:#f4f4f5;--tip-fg:#0b0b0c;--scroll:#2a2a2d;--bar-bg:rgba(10,10,11,.82);
  }
  :root[data-theme="light"]{
    color-scheme:light;
    --red:#d42a21;--red2:#c4241b;--teal:#0f9e8a;--teal2:#0b7d6d;
    --ink:#f3f4f6;--panel:#ffffff;--panel2:#f1f2f5;--panel3:#e8eaee;
    --line:rgba(16,18,24,.10);--line2:rgba(16,18,24,.20);
    --t1:#14161b;--t2:#4b4f58;--t3:#6b707a;
    --green:#0f8a52;--gold:#946d0c;--blue:#2563c9;--purple:#6d44c4;
    --hover:rgba(16,18,24,.04);--sel:rgba(15,158,138,.12);
    --shadow:0 1px 2px rgba(16,18,24,.06),0 6px 18px rgba(16,18,24,.06);
    --shadow-lg:0 24px 60px rgba(16,18,24,.18);
    --focus:#0f9e8a;--tip-bg:#14161b;--tip-fg:#fff;--scroll:#c9ccd3;--bar-bg:rgba(243,244,246,.85);
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      color-scheme:light;
      --red:#d42a21;--red2:#c4241b;--teal:#0f9e8a;--teal2:#0b7d6d;
      --ink:#f3f4f6;--panel:#ffffff;--panel2:#f1f2f5;--panel3:#e8eaee;
      --line:rgba(16,18,24,.10);--line2:rgba(16,18,24,.20);
      --t1:#14161b;--t2:#4b4f58;--t3:#6b707a;
      --green:#0f8a52;--gold:#946d0c;--blue:#2563c9;--purple:#6d44c4;
      --hover:rgba(16,18,24,.04);--sel:rgba(15,158,138,.12);
      --shadow:0 1px 2px rgba(16,18,24,.06),0 6px 18px rgba(16,18,24,.06);
      --shadow-lg:0 24px 60px rgba(16,18,24,.18);
      --focus:#0f9e8a;--tip-bg:#14161b;--tip-fg:#fff;--scroll:#c9ccd3;--bar-bg:rgba(243,244,246,.85);
    }
  }
  html,body{margin:0;background:var(--ink);color:var(--t1);font-family:'DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
  body{font-size:14px;line-height:1.45;}
  #root{overflow-x:clip;min-width:0;}
  *{box-sizing:border-box;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:8px;border:2px solid transparent;background-clip:padding-box;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::selection{background:var(--sel);}
  a{color:var(--teal);}
  /* ---- interactive primitives ---- */
  .dx-btn{transition:transform .12s ease,filter .15s ease,background-color .15s ease,box-shadow .15s ease,border-color .15s ease;-webkit-tap-highlight-color:transparent;}
  .dx-btn:hover{filter:brightness(1.08);box-shadow:0 2px 10px rgba(0,0,0,.18);}
  .dx-btn.ghost:hover{background-color:var(--hover)!important;border-color:var(--line2)!important;}
  .dx-btn:active{transform:translateY(1px) scale(.99);}
  .dx-btn:disabled{opacity:.5;cursor:not-allowed;}
  button:focus-visible,[role="button"]:focus-visible,a:focus-visible,summary:focus-visible,.dx-click:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--focus)!important;box-shadow:0 0 0 3px var(--sel);}
  input,select,textarea{transition:border-color .15s ease,box-shadow .15s ease;}
  input::placeholder,textarea::placeholder{color:var(--t3);}
  .dx-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);}
  .dx-click{cursor:pointer;transition:transform .15s ease,border-color .15s ease,background-color .15s ease,box-shadow .15s ease;}
  .dx-click:hover{border-color:var(--line2)!important;background-color:var(--panel2)!important;}
  .dx-lift:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);}
  .dx-nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1 1 auto;}
  .dx-nav::-webkit-scrollbar{display:none;}
  .dx-navi{transition:color .15s ease,background-color .15s ease;white-space:nowrap;}
  .dx-navi:hover{color:var(--t1)!important;background:var(--hover);}
  .dx-table{width:100%;border-collapse:collapse;}
  .dx-table tbody tr{transition:background-color .12s ease;}
  .dx-table tbody tr:hover{background:var(--hover);}
  .dx-th{cursor:pointer;user-select:none;white-space:nowrap;}
  .dx-th:hover{color:var(--t1)!important;}
  .dx-scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%;}
  .dx-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:5px 11px;border-radius:999px;border:1px solid var(--line2);background:transparent;color:var(--t2);cursor:pointer;font-family:inherit;transition:all .15s ease;}
  .dx-chip:hover{color:var(--t1);border-color:var(--t3);}
  .dx-chip.on{background:var(--sel);color:var(--t1);border-color:var(--teal);}
  .dx-chip b{font-family:'JetBrains Mono',monospace;font-weight:500;font-size:11px;color:var(--t3);}
  .dx-tip{position:fixed;z-index:9990;pointer-events:none;background:var(--tip-bg);color:var(--tip-fg);font-size:12px;line-height:1.35;padding:7px 10px;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.3);width:max-content;max-width:min(280px,calc(100vw - 16px));transform:translate(-50%,calc(-100% - 12px));white-space:normal;}
  .dx-tip b{font-weight:700;}
  .dx-tip .m{font-family:'JetBrains Mono',monospace;font-size:11px;opacity:.8;}
  .dx-bar{transition:opacity .15s ease,filter .15s ease;cursor:pointer;}
  .dx-chart:hover .dx-bar{opacity:.45;}
  .dx-chart .dx-bar:hover,.dx-chart .dx-bar.on{opacity:1;filter:brightness(1.12);}
  .dx-hbar{display:grid;grid-template-columns:96px minmax(0,1fr) auto;align-items:center;gap:10px;padding:6px 6px;border-radius:8px;cursor:pointer;transition:background-color .12s ease;}
  .dx-hbar:hover,.dx-hbar.on{background:var(--hover);}
  .dx-hbar .trk{height:10px;border-radius:6px;background:var(--panel2);overflow:hidden;}
  .dx-hbar .fill{height:100%;border-radius:6px;transition:width .5s cubic-bezier(.2,.8,.2,1);}
  .dx-pulse{animation:dxpulse 1.6s ease-in-out infinite;}
  @keyframes dxpulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  .dx-ifr-full{position:fixed!important;inset:0!important;z-index:9500!important;border-radius:0!important;height:100vh!important;margin:0!important;}
  .dx-resize{resize:vertical;overflow:hidden;}
  /* ---- responsive layout helpers (inline grids collapse on narrow screens) ---- */
  @media (max-width:1100px){
    .dx-grid-3{grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;}
    .dx-grid-3 > .dx-dock{grid-column:1 / -1;height:auto!important;position:static!important;}
  }
  @media (max-width:820px){
    .dx-grid,.dx-grid-3{grid-template-columns:minmax(0,1fr)!important;}
    .dx-pad{padding:14px 14px!important;}
    .dx-paper{padding:18px 16px!important;overflow-x:auto!important;}
    .dx-hide-sm{display:none!important;}
    .dx-topbar{padding:8px 12px!important;gap:8px 10px!important;flex-wrap:wrap;}
    .dx-topbar .dx-nav{order:5;flex-basis:100%;margin:0 -4px;}
    .dx-ingest{margin-left:auto;}
    .dx-ingest .dx-btn{margin-left:0!important;padding:7px 10px!important;}
    .dx-hbar{grid-template-columns:78px minmax(0,1fr) auto;}
    .dx-kpis{grid-template-columns:repeat(2,minmax(0,1fr))!important;flex-basis:100%!important;}
  }
  /* ---- dashboard: briefing hero, decision queue, rail ---- */
  :root{--hero-bg:#141416;--hero-fg:#f4f4f5;--hero-dim:rgba(244,244,245,.62);--hero-card:rgba(255,255,255,.06);--hero-line:rgba(255,255,255,.12);}
  :root[data-theme="light"]{--hero-bg:#17181d;--hero-fg:#f7f7f8;--hero-dim:rgba(247,247,248,.62);--hero-card:rgba(255,255,255,.07);--hero-line:rgba(255,255,255,.14);}
  @media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--hero-bg:#17181d;--hero-fg:#f7f7f8;--hero-dim:rgba(247,247,248,.62);--hero-card:rgba(255,255,255,.07);--hero-line:rgba(255,255,255,.14);}}
  .dx-dash{padding:18px 22px 90px;max-width:1480px;margin:0 auto;}
  .dx-hero{position:relative;overflow:hidden;border-radius:18px;background:var(--hero-bg);color:var(--hero-fg);padding:22px 26px 22px;margin-bottom:18px;border:1px solid var(--hero-line);}
  .dx-hero::before{content:"";position:absolute;inset:-40% -10% auto auto;width:62%;height:180%;background:radial-gradient(closest-side,color-mix(in srgb,var(--red) 38%,transparent),transparent 72%);pointer-events:none;}
  .dx-hero::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--red),var(--teal));}
  .dx-hero>*{position:relative;}
  .dx-hero-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;font-size:13px;color:var(--hero-dim);}
  .dx-hero-stamp{font-size:10.5px;letter-spacing:.4px;}
  .dx-hero-line{margin:8px 0 0;font-weight:800;font-size:clamp(20px,2.3vw,30px);line-height:1.18;letter-spacing:-.3px;max-width:22em;}
  .dx-hero-dim{color:var(--hero-dim);font-weight:700;}
  .dx-hero-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:18px;}
  .dx-hero-card{position:relative;background:var(--hero-card);border:1px solid var(--hero-line);border-radius:12px;padding:11px 32px 11px 13px;min-width:0;}
  .dx-hero-card.dx-click:hover{background:rgba(255,255,255,.1)!important;border-color:rgba(255,255,255,.22)!important;}
  .dx-hero-card-t{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .dx-hero-card-s{font-size:11.5px;color:var(--hero-dim);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .dx-hero-card-arrow{position:absolute;right:13px;top:50%;transform:translateY(-50%);font-size:20px;color:var(--hero-dim);}
  .dx-dash-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start;}
  .dx-dash-main{min-width:0;display:grid;gap:16px;}
  .dx-dash-rail{min-width:0;display:grid;gap:14px;position:sticky;top:64px;}
  .dx-dash-charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;}
  .dx-h2{font-weight:800;font-size:16px;margin:0;display:flex;align-items:center;gap:8px;letter-spacing:-.1px;}
  .dx-count{font-size:11px;font-weight:500;color:var(--t2);background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:1px 8px;line-height:1.6;}
  .dx-link{background:none;border:0;color:var(--teal);font-weight:700;font-size:12.5px;cursor:pointer;padding:6px 8px;border-radius:8px;}
  .dx-link:hover{background:var(--hover);}
  .dx-queue{padding:16px 18px 10px;}
  .dx-queue-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px;}
  .dx-queue-sub{font-size:12px;color:var(--t3);margin-top:3px;}
  .dx-queue-empty{padding:28px 10px 20px;text-align:center;color:var(--t2);font-size:13px;display:grid;gap:8px;justify-items:center;}
  .dx-dec-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:14px;padding:10px 10px 10px 12px;margin:0 -8px;border-radius:12px;border:1px solid transparent;transition:background-color .15s ease,border-color .15s ease;}
  .dx-dec-row:hover,.dx-dec-row.on{background:var(--hover);border-color:var(--line);}
  .dx-dec-row+.dx-dec-row{margin-top:2px;}
  .dx-dec-main{min-width:0;cursor:pointer;border-radius:8px;}
  .dx-dec-title{font-size:14px;font-weight:600;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .dx-dec-sub{display:flex;align-items:center;gap:10px;margin-top:3px;min-width:0;}
  .dx-dec-subtext{font-size:12px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
  .dx-policy{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;border-radius:999px;padding:2px 9px 2px 7px;white-space:nowrap;flex:0 0 auto;}
  .dx-policy i{width:6px;height:6px;border-radius:50%;display:inline-block;}
  .dx-dec-when{font-size:11px;color:var(--t3);white-space:nowrap;min-width:44px;text-align:right;}
  .dx-dec-done{display:inline-flex;align-items:center;justify-content:center;min-width:92px;padding:7px 14px;border-radius:9px;font-weight:700;font-size:12px;color:var(--onaccent);background:var(--green);animation:fadein .25s ease;}
  /* review drawer */
  .dx-drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9000;display:flex;justify-content:flex-end;}
  .dx-drawer{width:min(460px,100%);height:100%;overflow:auto;background:var(--ink);border-left:1px solid var(--line2);box-shadow:var(--shadow-lg);padding:18px 22px 26px;animation:dxslide .22s cubic-bezier(.2,.8,.2,1);}
  @keyframes dxslide{from{transform:translateX(24px);opacity:0;}to{transform:none;opacity:1;}}
  .dx-drawer-head{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .dx-drawer-x{width:32px;height:32px;border-radius:9px;border:1px solid var(--line2);background:transparent;color:var(--t2);cursor:pointer;font-size:13px;}
  .dx-drawer-title{font-weight:800;font-size:20px;line-height:1.2;margin:14px 0 4px;letter-spacing:-.2px;}
  .dx-drawer-sub{font-size:12.5px;color:var(--t2);}
  .dx-drawer-why{margin:14px 0;padding:11px 13px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-size:13px;line-height:1.45;color:var(--t1);}
  .dx-facts{display:grid;gap:0;border-top:1px solid var(--line);margin-bottom:6px;}
  .dx-fact{display:grid;grid-template-columns:118px minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px;}
  .dx-fact span{color:var(--t3);}
  .dx-fact b{font-weight:500;color:var(--t1);overflow-wrap:anywhere;}
  .dx-drawer-block{margin-top:14px;}
  .dx-drawer-label{font-size:11.5px;font-weight:600;color:var(--t3);margin-bottom:4px;}
  .dx-drawer-text{font-size:12.5px;line-height:1.5;color:var(--t2);white-space:pre-wrap;}
  .dx-drawer-pre{font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.5;white-space:pre-wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--t1);margin:0;max-height:260px;overflow:auto;}
  .dx-drawer-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px;padding-top:14px;border-top:1px solid var(--line);position:sticky;bottom:-26px;background:var(--ink);padding-bottom:4px;}
  /* rail */
  .dx-rail-card{padding:14px 16px;}
  .dx-rail-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .dx-rail-meta{font-size:10.5px;color:var(--t3);}
  .dx-week{display:grid;gap:2px;}
  .dx-week-day{display:grid;grid-template-columns:76px minmax(0,1fr);gap:8px;padding:6px 0;border-top:1px solid var(--line);align-items:start;}
  .dx-week-day:first-child{border-top:0;}
  .dx-week-day.weekend{opacity:.55;}
  .dx-week-day.has .dx-week-dow b{color:var(--t1);}
  .dx-week-dow{display:flex;flex-direction:column;font-size:12px;color:var(--t2);line-height:1.25;padding-top:3px;}
  .dx-week-dow b{font-weight:600;}
  .dx-week-dow .mono{font-size:10px;color:var(--t3);}
  .dx-week-items{display:grid;gap:3px;min-width:0;}
  .dx-week-bid{display:grid;grid-template-columns:8px minmax(0,1fr);column-gap:8px;align-items:center;padding:4px 6px;border-radius:8px;border:1px solid transparent;min-width:0;}
  .dx-week-dot{width:8px;height:8px;border-radius:50%;grid-row:span 2;}
  .dx-week-name{font-size:12px;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .dx-week-gc{font-size:10.5px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .dx-week-none{font-size:11px;color:var(--t3);padding:5px 6px;display:block;}
  .dx-pulse{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;}
  .dx-pulse-donut{display:flex;align-items:center;gap:10px;border-radius:12px;padding:4px;border:1px solid transparent;}
  .dx-pulse-donut-l{font-size:12px;color:var(--t2);display:flex;flex-direction:column;}
  .dx-pulse-donut-l span{font-size:10.5px;color:var(--t3);}
  .dx-pulse-stats{display:grid;gap:4px;}
  .dx-pulse-stat{display:flex;align-items:baseline;gap:8px;padding:4px 8px;border-radius:8px;border:1px solid transparent;min-width:0;white-space:nowrap;}
  .dx-pulse-stat b{font-weight:800;font-size:16px;flex:0 0 auto;}
  .dx-pulse-stat span{font-size:11.5px;color:var(--t3);min-width:0;overflow:hidden;text-overflow:ellipsis;}
  .dx-ask{position:fixed;right:22px;bottom:20px;z-index:800;display:inline-flex;align-items:center;gap:8px;padding:10px 14px 10px 12px;border-radius:999px;border:1px solid var(--line2);background:var(--panel);color:var(--t1);font-weight:700;font-size:13px;cursor:pointer;box-shadow:var(--shadow-lg);}
  .dx-ask:hover{border-color:var(--teal);}
  .dx-ask span{color:var(--teal);}
  .dx-ask kbd{font-size:10px;color:var(--t3);border:1px solid var(--line2);border-radius:5px;padding:1px 5px;}
  /* command palette */
  .dx-pal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9500;display:flex;align-items:flex-start;justify-content:center;padding:90px 16px 16px;}
  .dx-pal{width:min(640px,100%);background:var(--ink);border:1px solid var(--line2);border-radius:16px;box-shadow:var(--shadow-lg);overflow:hidden;animation:fadein .2s ease;}
  .dx-pal-input{display:flex;align-items:center;gap:10px;padding:6px 14px 6px 16px;border-bottom:1px solid var(--line);}
  .dx-pal-spark{color:var(--teal);font-size:15px;}
  .dx-pal-input input{flex:1;background:transparent;border:0;outline:none;color:var(--t1);font-size:15px;padding:12px 0;box-shadow:none!important;}
  .dx-pal-input kbd{font-size:10px;color:var(--t3);border:1px solid var(--line2);border-radius:5px;padding:2px 6px;}
  .dx-pal-answer{padding:12px 16px 14px;border-bottom:1px solid var(--line);background:var(--panel);}
  .dx-pal-from{font-size:10px;letter-spacing:.6px;text-transform:uppercase;color:var(--teal);margin-bottom:6px;}
  .dx-pal-text{font-size:13.5px;line-height:1.5;white-space:pre-wrap;color:var(--t1);max-height:240px;overflow:auto;}
  .dx-pal-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .dx-pal-actions:empty{display:none;}
  .dx-pal-sugg{display:flex;gap:6px;flex-wrap:wrap;padding:12px 16px 4px;}
  .dx-pal-label{font-size:10px;letter-spacing:.6px;text-transform:uppercase;color:var(--t3);padding:12px 16px 4px;}
  .dx-pal-list{max-height:320px;overflow:auto;padding:0 8px 8px;}
  .dx-pal-item{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:10px;cursor:pointer;}
  .dx-pal-item:hover,.dx-pal-item:focus-visible{background:var(--hover);}
  .dx-pal-item-t{font-size:13.5px;color:var(--t1);min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .dx-pal-item-s{font-size:11.5px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .dx-pal-tag{font-size:10px;color:var(--t3);border:1px solid var(--line);border-radius:6px;padding:2px 7px;}
  .dx-pal-empty{padding:14px 10px 18px;font-size:12.5px;color:var(--t3);}
  .dx-pal-foot{display:flex;gap:16px;padding:8px 16px;border-top:1px solid var(--line);font-size:10.5px;color:var(--t3);}
  @media (max-width:1100px){.dx-dash-grid{grid-template-columns:minmax(0,1fr);}.dx-dash-rail{position:static;}}
  @media (max-width:820px){.dx-dash{padding:14px 14px 90px;}.dx-dash-charts{grid-template-columns:minmax(0,1fr);}.dx-dec-row{grid-template-columns:minmax(0,1fr) auto;}.dx-dec-when{display:none;}.dx-hero{padding:18px 16px;}.dx-ask kbd{display:none;}.dx-drawer{width:100%;}}
  .mono{font-family:'JetBrains Mono',monospace;}
  .syne{font-family:'Syne',sans-serif;}
  /* boot */
  #boot{position:fixed;inset:0;z-index:9999;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s ease;}
  #boot.gone{opacity:0;pointer-events:none;}
  .bgrid{display:grid;grid-template-columns:repeat(8,10px);gap:4px;margin-bottom:26px;}
  .bgrid i{width:10px;height:26px;background:#1c1c1f;border-radius:2px;display:block;animation:fall .9s ease forwards;}
  @keyframes fall{0%{transform:translateY(-120px) scaleY(1.4);background:#e8332a;opacity:0;}60%{opacity:1;}100%{transform:translateY(0) scaleY(1);background:#1c1c1f;opacity:1;}}
  .bword{font-family:'Syne';font-weight:800;font-size:52px;letter-spacing:8px;color:#fff;opacity:0;animation:fade .6s ease .55s forwards;}
  .bbar{width:240px;height:2px;background:#1c1c1f;margin-top:22px;overflow:hidden;}
  .bbar > i{display:block;height:100%;width:0;background:#e8332a;animation:load 1.5s ease forwards;}
  @keyframes load{to{width:100%;}}
  @keyframes fade{to{opacity:1;}}
  .bstat{margin-top:14px;font-family:'JetBrains Mono';font-size:11px;color:#5f5f63;letter-spacing:1px;height:16px;}
  @media(prefers-reduced-motion:reduce){.bgrid i,.bword,.bbar>i{animation:none;opacity:1;width:100%;}
    *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important;}
    .dx-click:hover,.dx-lift:hover,.dx-btn:active{transform:none!important;}}
  .fade-in{animation:fadein .25s ease;}
  @keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
  input,select,textarea{font-family:inherit;}
</style>
