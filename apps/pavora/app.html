<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PAVORA</title>
<meta name="theme-color" content="#0B0B0C">
<script>try{var t=localStorage.getItem("pavora_theme")||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark");document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<meta name="description" content="PAVORA — flooring business operations. A DEMEX ecosystem application.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{
  /* PAVORA · Wayne's Carpet Plus. Dark = near-black with gold as accent only. Light = warm paper. */
  --font:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --r:14px; --r2:10px;
  --brand:#D9B943; --brand2:#B8952A; --gold-deep:#8C6F12; --brand-ink:#15110A;
  --teal:#4FCBA4; --amber:#E8B04A; --red:#F27168; --green:#5FD392; --blue:#6FA8F5;
  color-scheme:dark;
  --bg:#0B0B0C; --bg2:#121214; --surface:#141416; --glass:rgba(255,255,255,.035); --glass2:rgba(255,255,255,.065);
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.15); --text:#ECEBE6; --dim:#9A9890; --dim2:#67655E;
  --input:rgba(0,0,0,.35); --side:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.01)); --modal:linear-gradient(180deg,#1A1A1D,#121214); --toast:#1A1A1D; --option:#1A1A1D;
  --body:radial-gradient(900px 500px at 8% -10%,rgba(217,185,67,.07),transparent 60%),var(--bg);
  --shadow:0 10px 40px rgba(0,0,0,.55); --kpi:var(--text);
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#F6F4EE; --bg2:#FFFFFF; --surface:#FFFFFF; --glass:rgba(255,255,255,.75); --glass2:rgba(20,16,8,.05);
  --line:rgba(20,16,8,.10); --line2:rgba(20,16,8,.2); --text:#1A1812; --dim:#5E5A4E; --dim2:#8E897B;
  --brand:#A8841A; --brand2:#8C6F12; --gold-deep:#6F5708; --brand-ink:#FFFFFF;
  --teal:#128C68; --amber:#B4770A; --red:#C8342A; --green:#1E8F4E; --blue:#1F62C4;
  --input:#FFFFFF; --side:linear-gradient(180deg,#FFFFFF,#F9F7F1); --modal:#FFFFFF; --toast:#FFFFFF; --option:#FFFFFF;
  --body:radial-gradient(900px 500px at 8% -10%,rgba(168,132,26,.08),transparent 60%),var(--bg);
  --shadow:0 10px 40px rgba(20,16,8,.14); --kpi:var(--text);
}
*{box-sizing:border-box} html,body{margin:0;height:100%}
body{font-family:var(--font);background:var(--body);color:var(--text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:var(--brand);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--input);border:1px solid var(--line2);border-radius:var(--r2);padding:8px 10px;width:100%;outline:none;transition:border .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(217,185,67,.2)}
select option{background:var(--option)}
textarea{min-height:70px;resize:vertical}
label.f{display:block;font-size:12px;color:var(--dim);margin:8px 0 4px}
.btn{background:var(--glass2);border:1px solid var(--line2);border-radius:var(--r2);padding:8px 14px;cursor:pointer;transition:all .15s;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25)}
.btn.primary{background:linear-gradient(135deg,var(--brand2),var(--brand));color:var(--brand-ink);border-color:transparent;font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{border-color:rgba(255,107,107,.4);color:var(--red)}
.btn.sm{padding:5px 10px;font-size:12.5px} .btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;border-color:transparent;color:var(--dim)} .btn.ghost:hover{color:var(--text);background:var(--glass)}

/* layout */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:18px 12px;border-right:1px solid var(--line);background:var(--side);backdrop-filter:blur(18px);display:flex;flex-direction:column;overflow:auto}
.logo{display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 6px 16px;border-bottom:1px solid var(--line);margin-bottom:8px}
.logo img{width:140px;height:auto} :root[data-theme="light"] .logo img{filter:none}
.logo .mark{display:none}
.logo .name{font-weight:800;letter-spacing:.32em;font-size:12px;color:var(--dim);text-transform:uppercase} .logo .co{display:none}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;color:var(--dim);font-weight:500;margin:1px 0;transition:all .12s}
.nav a:hover{color:var(--text);background:var(--glass)} .nav a.on{color:var(--text);background:var(--glass2);box-shadow:inset 3px 0 0 var(--brand)}
.nav a .ic{width:18px;text-align:center;opacity:.9} .nav a .badge{margin-left:auto;font-size:10.5px;background:rgba(217,185,67,.16);color:var(--brand);border-radius:999px;padding:1px 7px}
.nav .sec{font-size:10.5px;letter-spacing:.12em;color:var(--dim2);text-transform:uppercase;padding:14px 10px 4px}
.side .foot{margin-top:auto;padding:10px;font-size:11.5px;color:var(--dim2)}
.main{padding:22px 28px 60px;min-width:0}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.topbar h1{font-size:22px;font-weight:700;margin:0;letter-spacing:-.01em} .topbar .sub{color:var(--dim);font-size:13px}
.topbar .sp{flex:1}
.sync{font-size:11.5px;color:var(--dim2);display:flex;align-items:center;gap:6px} .sync .dot{width:7px;height:7px;border-radius:50%;background:var(--green)} .sync .dot.err{background:var(--red)} .sync .dot.busy{background:var(--amber)}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;backdrop-filter:blur(14px);box-shadow:0 1px 0 rgba(255,255,255,.04) inset}
.card h3{margin:0 0 10px;font-size:13px;color:var(--dim);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.grid{display:grid;gap:14px} .g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)} .g5{grid-template-columns:repeat(5,1fr)}
.kpi{padding:14px 16px} .kpi .v{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-top:2px} .kpi .l{font-size:12px;color:var(--dim)} .kpi.warn .v{color:var(--amber)} .kpi.good .v{color:var(--teal)} .kpi .h{font-size:11.5px;color:var(--dim2);margin-top:4px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap} .col{display:flex;flex-direction:column;gap:8px}
.dim{color:var(--dim)} .dim2{color:var(--dim2)} .mono{font-family:var(--mono)} .small{font-size:12px} .xs{font-size:11px} .b{font-weight:600} .right{text-align:right}
.money{font-family:var(--mono);font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:var(--glass2);border:1px solid var(--line);color:var(--dim)}
.pill.lead{color:var(--blue);border-color:rgba(77,163,255,.35)} .pill.estimate{color:var(--amber);border-color:rgba(243,178,62,.35)} .pill.won{color:var(--teal);border-color:rgba(42,209,184,.35)} .pill.closing{color:var(--brand);border-color:rgba(217,185,67,.35)} .pill.closed{color:var(--green);border-color:rgba(61,220,151,.35)}
.pill.approved{color:var(--green)} .pill.draft{color:var(--dim)} .pill.proposed{color:var(--amber)} .pill.superseded{color:var(--dim2)} .pill.rejected{color:var(--red)}
.pill.ok{color:var(--green)} .pill.off{color:var(--red)} .pill.warn{color:var(--amber)}
.tbl{width:100%;border-collapse:collapse} .tbl th{text-align:left;font-size:11.5px;color:var(--dim2);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);letter-spacing:.04em;text-transform:uppercase} .tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top} .tbl tr:hover td{background:rgba(255,255,255,.025)} .tbl tr.click{cursor:pointer}
.tbl td.r,.tbl th.r{text-align:right}
.empty{padding:28px;text-align:center;color:var(--dim2);border:1px dashed var(--line2);border-radius:var(--r)}
.list{display:flex;flex-direction:column;gap:8px} .item{padding:10px 12px;border:1px solid var(--line);border-radius:var(--r2);background:var(--glass)} .item:hover{border-color:var(--line2)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:4px 0 14px} .tabs button{background:none;border:none;padding:8px 12px;color:var(--dim);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px} .tabs button.on{color:var(--text);border-color:var(--brand)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px} .kv div:nth-child(odd){color:var(--dim)}
.banner{padding:10px 14px;border-radius:var(--r2);font-size:13px;border:1px solid} .banner.warn{background:rgba(243,178,62,.08);border-color:rgba(243,178,62,.3);color:#f6c871} .banner.info{background:rgba(77,163,255,.08);border-color:rgba(77,163,255,.3);color:#9ccaff} .banner.err{background:rgba(255,107,107,.08);border-color:rgba(255,107,107,.3);color:#ff9b9b}
.search{max-width:320px}

/* kanban */
.kanban{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
.kcol{min-width:222px;max-width:222px;background:var(--glass);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.kcol h4{margin:0 0 8px;font-size:12px;color:var(--dim);display:flex;justify-content:space-between;align-items:center} .kcol h4 span{color:var(--dim2);font-weight:500}
.kcol.over{border-color:var(--brand);background:rgba(217,185,67,.06)}
.kcard{background:var(--glass2);border:1px solid var(--line);border-radius:var(--r2);padding:9px 10px;margin-bottom:8px;cursor:grab;transition:transform .1s} .kcard:hover{border-color:var(--line2);transform:translateY(-1px)} .kcard .t{font-weight:600;font-size:13px} .kcard .m{font-size:11.5px;color:var(--dim);margin-top:3px}
.kcol .tot{font-size:11px;color:var(--dim2);margin-top:4px}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);display:grid;place-items:center;z-index:50;padding:20px}
.modal{width:min(720px,100%);max-height:90vh;overflow:auto;background:var(--modal);border:1px solid var(--line2);border-radius:18px;padding:22px;box-shadow:var(--shadow)}
.modal h2{margin:0 0 12px;font-size:17px} .modal .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.modal.wide{width:min(1000px,100%)}

/* toast */
.toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:60}
.toast{background:var(--toast);border:1px solid var(--line2);border-left:3px solid var(--teal);border-radius:10px;padding:10px 14px;font-size:13px;box-shadow:var(--shadow);max-width:380px} .toast.err{border-left-color:var(--red)}

/* chat */
.chat{display:flex;flex-direction:column;height:calc(100vh - 180px);min-height:420px} .chat .log{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:4px 2px} .msg{max-width:78%;padding:10px 14px;border-radius:14px;white-space:pre-wrap;line-height:1.5} .msg.u{align-self:flex-end;background:rgba(217,185,67,.16);border:1px solid rgba(217,185,67,.35)} .msg.a{align-self:flex-start;background:var(--glass2);border:1px solid var(--line)}
.chat .in{display:flex;gap:8px;margin-top:10px}

/* misc */
.ph{padding:40px;border:1px dashed var(--line2);border-radius:var(--r);color:var(--dim)} .ph h2{margin:0 0 8px;color:var(--text)} .ph ul{margin:8px 0 0 18px;padding:0}
.lines td input,.lines td select{padding:5px 7px;font-size:13px} .lines td{padding:4px 6px}
.menu{position:relative}
@media (max-width:980px){.app{grid-template-columns:1fr}.side{position:relative;height:auto;flex-direction:row;flex-wrap:wrap;gap:4px;padding:10px}.side .foot,.nav .sec{display:none}.nav{display:flex;flex-wrap:wrap;gap:2px}.nav a{padding:6px 9px;font-size:12.5px}.main{padding:16px}.g4,.g5{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}.g2{grid-template-columns:1fr}.logo{padding:4px 8px}}
.lines{min-width:980px} .lines td input{min-width:72px} .lines td select{min-width:150px} .card:has(> .lines){overflow-x:auto}
.kanban{min-height:300px}

.topbar h1{color:var(--text)} .kpi .v{color:var(--kpi)} .kpi.good .v{color:var(--teal)}

/* theme toggle */
.theme{display:inline-flex;border:1px solid var(--line2);border-radius:999px;overflow:hidden} .theme button{background:none;border:none;padding:5px 10px;font-size:12px;color:var(--dim);cursor:pointer} .theme button.on{background:var(--glass2);color:var(--text)}
:root[data-theme="light"] .kcard,:root[data-theme="light"] .item{background:#FBFAF6}
:root[data-theme="light"] .pill{background:#F1EEE5}

/* loading screen (static in index.html so it paints before React loads; removed by PV.bootDone) */
.boot{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:var(--body);transition:opacity .4s ease,visibility .4s}
.boot.out{opacity:0;visibility:hidden;pointer-events:none}
.boot-mark{font-family:var(--font);font-size:clamp(34px,7vw,52px);font-weight:800;letter-spacing:.32em;padding-left:.32em;background:linear-gradient(100deg,var(--gold-deep) 0%,var(--brand) 35%,#F4E3A1 50%,var(--brand) 65%,var(--gold-deep) 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:boot-shine 2.4s ease-in-out infinite}
.boot-tag{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim2)}
.boot-bar{width:min(220px,60vw);height:3px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:14px}
.boot-bar i{display:block;width:40%;height:100%;border-radius:3px;background:var(--brand);animation:boot-slide 1.2s ease-in-out infinite}
.boot-msg{font-size:12.5px;color:var(--dim);min-height:1.4em;text-align:center;padding:0 16px} .boot-msg.err{color:var(--red)}
.boot.stuck .boot-bar i,.boot.stuck .boot-mark{animation:none}
@keyframes boot-slide{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
@keyframes boot-shine{0%,100%{background-position:100% 0}50%{background-position:0 0}}
@media (prefers-reduced-motion:reduce){.boot-mark,.boot-bar i{animation:none}.boot-bar i{width:100%;opacity:.5}}

/* clickable KPI tiles */
.kpi.click{cursor:pointer;transition:border-color .15s,transform .15s} .kpi.click:hover{border-color:var(--line2);transform:translateY(-1px)} .kpi.click:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

</style>
</head>
<body>
<div id="boot" class="boot" role="status" aria-live="polite">
  <div class="boot-mark">PAVORA</div>
  <div class="boot-tag">Flooring operations</div>
  <div class="boot-bar"><i></i></div>
  <div class="boot-msg" id="boot-msg">Loading…</div>
</div>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script>/* js/data/schema.js */
/* PAVORA data schema — one company's state blob (stored at DEMEX Core app_state "pavora:<org>").
   Plain script: works in the browser (window.PV) and in node tests (globalThis.PV). */
(function (root) {
  var PV = root.PV = root.PV || {};

  PV.SCHEMA_VERSION = 1;

  // Default sales pipeline (customizable per company in Settings).
  // `effects` fire automatically when a project enters the stage (see logic.js).
  PV.DEFAULT_STAGES = [
    { id: 'new_lead',        label: 'New Lead',                 kind: 'lead' },
    { id: 'contacted',       label: 'Contacted',                kind: 'lead' },
    { id: 'appt_scheduled',  label: 'Appointment Scheduled',    kind: 'lead' },
    { id: 'measure_sched',   label: 'Measurement Scheduled',    kind: 'lead' },
    { id: 'estimating',      label: 'Estimate in Progress',     kind: 'estimate' },
    { id: 'proposal_sent',   label: 'Proposal Sent',            kind: 'estimate' },
    { id: 'awaiting',        label: 'Awaiting Approval',        kind: 'estimate' },
    { id: 'approved',        label: 'Approved',                 kind: 'won', effects: ['lock_estimate', 'create_material_list'] },
    { id: 'materials',       label: 'Materials Ordered',        kind: 'won' },
    { id: 'install_sched',   label: 'Installation Scheduled',   kind: 'won' },
    { id: 'installing',      label: 'Installation In Progress', kind: 'won' },
    { id: 'completed',       label: 'Completed',                kind: 'won', effects: ['release_reservations'] },
    { id: 'invoiced',        label: 'Invoiced',                 kind: 'closing' },
    { id: 'paid',            label: 'Paid',                     kind: 'closed' }
  ];

  // Flooring rate ids shared with Estimatio (hosted/Estimatio.html RATE_DEFAULTS). Do not rename.
  PV.FLOORING_RATES = [
    { id: 'flr_lvt',         label: 'LVT / LVP plank or tile install',          unit: 'SF', cat: 'Resilient' },
    { id: 'flr_sheet',       label: 'Sheet vinyl (heat-welded seams)',           unit: 'SF', cat: 'Resilient' },
    { id: 'flr_vct',         label: 'VCT install',                               unit: 'SF', cat: 'Resilient' },
    { id: 'flr_rubber',      label: 'Rubber flooring / sports tile',             unit: 'SF', cat: 'Resilient' },
    { id: 'flr_carpet_tile', label: 'Carpet tile install',                       unit: 'SF', cat: 'Carpet' },
    { id: 'flr_broadloom',   label: 'Broadloom carpet install',                  unit: 'SY', cat: 'Carpet' },
    { id: 'flr_tile_floor',  label: 'Ceramic / porcelain floor tile',            unit: 'SF', cat: 'Tile' },
    { id: 'flr_tile_wall',   label: 'Wall tile',                                 unit: 'SF', cat: 'Tile' },
    { id: 'flr_tile_trim',   label: 'Schluter / metal trim',                     unit: 'LF', cat: 'Tile' },
    { id: 'flr_wood',        label: 'Engineered / hardwood install',             unit: 'SF', cat: 'Wood & laminate' },
    { id: 'flr_laminate',    label: 'Laminate (floating)',                       unit: 'SF', cat: 'Wood & laminate' },
    { id: 'flr_base',        label: 'Wall base / baseboard',                     unit: 'LF', cat: 'Accessories' },
    { id: 'flr_transition',  label: 'Transitions / reducers / T-mold',           unit: 'LF', cat: 'Accessories' },
    { id: 'flr_stairs',      label: 'Stair treads + risers',                     unit: 'EA', cat: 'Accessories' },
    { id: 'flr_prep_skim',   label: 'Floor prep / skim coat',                    unit: 'SF', cat: 'Prep' },
    { id: 'flr_grind',       label: 'Grind / scrape adhesive',                   unit: 'SF', cat: 'Prep' },
    { id: 'flr_moisture',    label: 'Moisture mitigation',                       unit: 'SF', cat: 'Prep' },
    { id: 'flr_selflevel',   label: 'Self-leveling underlayment',                unit: 'SF', cat: 'Prep' },
    { id: 'flr_furniture',   label: 'Furniture move & reset',                    unit: 'SF', cat: 'Prep' },
    { id: 'demo_floor',      label: 'Demo existing flooring to slab',            unit: 'SF', cat: 'Demolition' },
    { id: 'demo_base',       label: 'Demo existing wall base',                   unit: 'LF', cat: 'Demolition' }
  ];

  PV.PRODUCT_CATEGORIES = ['Carpet', 'Carpet Tile', 'LVP', 'LVT', 'Sheet Vinyl', 'Ceramic Tile', 'Porcelain Tile',
    'Hardwood', 'Laminate', 'Baseboard', 'Transition', 'Underlayment', 'Floor Prep', 'Adhesive / Sundries'];

  PV.UNITS = ['SF', 'SY', 'LF', 'BOX', 'ROLL', 'PC', 'EA'];

  PV.ROLES = {
    owner:      { label: 'Owner / Admin', can: ['*'] },
    manager:    { label: 'Manager',       can: ['crm', 'sales', 'projects', 'estimates', 'catalog', 'inventory', 'purchasing', 'install', 'crews', 'financials', 'reports'] },
    sales:      { label: 'Sales Rep',     can: ['crm', 'sales', 'projects', 'estimates', 'catalog'] },
    installer:  { label: 'Installer',     can: ['install'] },
    accounting: { label: 'Accounting',    can: ['financials', 'reports', 'purchasing'] }
  };

  PV.uid = function (prefix) {
    var t = Date.now().toString(36);
    var r = Math.random().toString(36).slice(2, 8);
    return (prefix || 'pv') + '_' + t + r;
  };

  PV.now = function () { return new Date().toISOString(); };

  // Empty state for a company. companyId is the DEMEX org id (e.g. "wcp").
  PV.emptyState = function (companyId, companyName) {
    return {
      schemaVersion: PV.SCHEMA_VERSION,
      companyId: companyId,
      company: {
        name: companyName || '',
        address: '', phone: '', email: '', website: '',
        defaultMarkupPct: 90, markupRange: [80, 100], defaultWastePct: 10, depositPct: 50, taxRatePct: 7
      },
      stages: PV.DEFAULT_STAGES.map(function (s) { return Object.assign({}, s); }),
      users: companyId === 'wcp' ? [
        { id: 'us_ryan', companyId: 'wcp', name: 'Ryan Hardin', role: 'owner', title: 'Owner', email: '' },

<script>/* js/data/units.js */
/* Flooring unit conversions. A product's packaging decides how BOX/ROLL/PC map to area or length. */
(function (root) {
  var PV = root.PV = root.PV || {};

  // product.pack = { unit:'SF'|'SY'|'LF'|'EA', perBox?, perRoll?, perPiece? }
  // e.g. LVP: {unit:'SF', perBox:23.64}; broadloom: {unit:'SY', perRoll:133.33 (12' x 100')}; base: {unit:'LF', perPiece:4}
  var AREA = { SF: 1, SY: 9 };     // in SF
  var LEN = { LF: 1 };

  PV.units = {
    isArea: function (u) { return !!AREA[u]; },
    isLength: function (u) { return !!LEN[u]; },

    // Convert a quantity between base units (SF<->SY, LF<->LF). Returns null if incompatible.
    convertBase: function (qty, from, to) {
      if (from === to) return qty;
      if (AREA[from] && AREA[to]) return qty * AREA[from] / AREA[to];
      if (LEN[from] && LEN[to]) return qty;
      return null;
    },

    // How many packaging units cover `qty` of base units, given the product's pack. Rounds up whole packs.
    packsFor: function (qty, unit, product) {
      var pack = product && product.pack;
      if (!pack || !pack.unit) return null;
      var base = PV.units.convertBase(qty, unit, pack.unit);
      if (base === null) return null;
      var per = pack.perBox || pack.perRoll || pack.perPiece;
      if (!per) return null;
      var count = Math.ceil(base / per - 1e-9);
      var packUnit = pack.perBox ? 'BOX' : pack.perRoll ? 'ROLL' : 'PC';
      return { count: count, unit: packUnit, covers: count * per, coverUnit: pack.unit, overage: count * per - base };
    },

    // Base quantity represented by `count` packs.
    baseFromPacks: function (count, product) {
      var pack = product && product.pack;
      if (!pack) return null;
      var per = pack.perBox || pack.perRoll || pack.perPiece;
      return per ? { qty: count * per, unit: pack.unit } : null;
    },

    withWaste: function (qty, wastePct) { return qty * (1 + (wastePct || 0) / 100); },

    fmt: function (qty, unit) {
      if (qty === null || qty === undefined || isNaN(qty)) return '—';
      var n = Math.round(qty * 100) / 100;
      return n.toLocaleString() + ' ' + (unit || '');

<script>/* js/data/logic.js */
/* PAVORA business logic over the state blob. Pure functions: (state, ...) -> mutate state in place & return result.

(function (root) {
  var PV = root.PV = root.PV || {};
  var L = PV.logic = {};

  function find(arr, id) { for (var i = 0; i < arr.length; i++) if (arr[i].id === id) return arr[i]; return null; }
  function sum(arr, f) { return arr.reduce(function (a, x) { return a + (f ? f(x) : x) || 0; }, 0); }
  function round2(n) { return Math.round((n || 0) * 100) / 100; }
  L.find = find; L.sum = sum; L.round2 = round2;

  L.log = function (state, kind, text, ref) {
    state.activity.unshift({ ts: PV.now(), kind: kind, text: text, ref: ref || null });
    if (state.activity.length > 500) state.activity.length = 500;
  };

  // ---------- Customers ----------
  L.addCustomer = function (state, c) {
    var cust = Object.assign({
      id: PV.uid('cu'), companyId: state.companyId, name: '', type: 'residential', phone: '', email: '',
      billing: { address: '' }, properties: [], repId: null, notes: [], comms: [], followUps: [], docs: [],
      createdAt: PV.now()
    }, c || {});
    if (!cust.properties.length) cust.properties.push({ id: PV.uid('pr'), label: 'Primary', address: cust.billing.address || '' });
    state.customers.push(cust);
    L.log(state, 'customer', 'New customer: ' + cust.name, cust.id);
    return cust;
  };
  L.addProperty = function (state, customerId, label, address) {
    var c = find(state.customers, customerId); if (!c) return null;
    var p = { id: PV.uid('pr'), label: label || 'Property', address: address || '' };
    c.properties.push(p); return p;
  };
  L.addNote = function (state, customerId, text, userId) {
    var c = find(state.customers, customerId); if (!c) return null;
    var n = { id: PV.uid('nt'), ts: PV.now(), text: text, userId: userId || null }; c.notes.unshift(n); return n;
  };
  L.addComm = function (state, customerId, channel, summary, userId) {
    var c = find(state.customers, customerId); if (!c) return null;
    var m = { id: PV.uid('cm'), ts: PV.now(), channel: channel, summary: summary, userId: userId || null }; c.comms.unshift(m); return m;
  };
  L.addFollowUp = function (state, customerId, dueAt, text) {

    var f = { id: PV.uid('fu'), dueAt: dueAt, text: text, done: false }; c.followUps.push(f); return f;
  };
  L.customerProjects = function (state, customerId) { return state.projects.filter(function (p) { return p.customerId === customerId; }); };

  // ---------- Projects + pipeline ----------
  L.stage = function (state, id) { return find(state.stages, id); };
  L.stageIndex = function (state, id) { for (var i = 0; i < state.stages.length; i++) if (state.stages[i].id === id) return i; return -1; };

  L.addProject = function (state, p) {
    var proj = Object.assign({
      id: PV.uid('pj'), companyId: state.companyId, customerId: null, propertyId: null, name: '',
      stageId: state.stages[0].id, repId: null, estimateId: null, source: 'manual',
      contract: { originalEstimate: 0, approvedValue: 0, changeOrders: [] },
      materials: [],          // [{productId, rateId, qty, unit, reserved:bool, poId}]
      ledger: { invoices: [], payments: [], expenses: [] },   // PAVORA ledger until NUMORA exists
      actuals: { materialCost: 0, laborCost: 0, laborHours: 0, quantities: {} },
      installDate: null, crewId: null, timeline: [], notes: '', createdAt: PV.now(), closedAt: null
    }, p || {});
    proj.timeline.push({ ts: PV.now(), stageId: proj.stageId });
    state.projects.push(proj);
    L.log(state, 'project', 'New project: ' + proj.name, proj.id);
    return proj;
  };

  // Move a project to a stage. Fires the stage's effects (approved -> lock estimate, etc.).
  L.moveStage = function (state, projectId, stageId) {
    var p = find(state.projects, projectId); var s = L.stage(state, stageId);
    if (!p || !s) return { ok: false, error: 'project or stage not found' };
    if (p.stageId === stageId) return { ok: true, effects: [] };
    var fired = [];
    (s.effects || []).forEach(function (e) {
      if (e === 'lock_estimate') {
        var est = p.estimateId && find(state.estimates, p.estimateId);
        var cur = est && L.currentVersion(est);
        if (!cur) { fired.push({ effect: e, ok: false, reason: 'no estimate to approve' }); return; }
        if (cur.status !== 'approved') L.approveVersion(state, est.id, cur.v);
        p.contract.approvedValue = cur.totals.sell; if (!p.contract.originalEstimate) p.contract.originalEstimate = cur.totals.sell;

      } else if (e === 'release_reservations') {
        L.releaseReservations(state, p.id); fired.push({ effect: e, ok: true });

  };

  // ---------- Estimates (versioned) ----------
  L.currentVersion = function (est) { if (!est || !est.versions.length) return null; return est.versions[est.versions.length - 1]; };
  L.approvedVersion = function (est) { var a = null; (est.versions || []).forEach(function (v) { if (v.status === 'approved') a = v; }); return a; };

  L.totalsFromLines = function (lines, opts) {

    return { labor: round2(labor), material: round2(mat), direct: round2(direct), overhead: round2(oh), profit: round2(profit), tax: round2(tax), sell: round2(direct + oh + profit + tax) };
  };

  L.createEstimate = function (state, projectId) {
    var p = find(state.projects, projectId); if (!p) return null;
    var est = { id: PV.uid('es'), companyId: state.companyId, projectId: projectId, versions: [], createdAt: PV.now() };
    state.estimates.push(est); p.estimateId = est.id;
    return est;
  };

  // Add a version. Lines: [{rateId, label, qty, unit, laborRate, materialUnitCost, markupPct, wastePct, productId}]
  L.addVersion = function (state, estimateId, lines, source, opts) {
    var est = find(state.estimates, estimateId); if (!est) return null;

      totals: L.totalsFromLines(lines, opts || {}), opts: opts || {}, source: source || { kind: 'manual' }, createdAt: PV.now(), approvedAt: null };
    est.versions.push(ver); est.currentV = ver.v;
    var p = find(state.projects, est.projectId);

  };
  L.updateVersion = function (state, estimateId, v, lines, opts) {
    var est = find(state.estimates, estimateId); var ver = est && find(est.versions.map(function (x) { return Object.assign({ id: x.v }, x); }), v);

    if (real.status === 'approved') return { ok: false, error: 'approved versions are locked — add a new version' };
    real.lines = lines.map(function (l) { return Object.assign({}, l); }); real.opts = opts || real.opts; real.totals = L.totalsFromLines(real.lines, real.opts);

  };
  L.setVersionStatus = function (state, estimateId, v, status) {
    var est = find(state.estimates, estimateId); var ver = est && est.versions[v - 1]; if (!ver) return { ok: false };
    if (ver.status === 'approved' && status !== 'approved') return { ok: false, error: 'approved versions cannot be un-approved; add a new version' };
    ver.status = status; return { ok: true };
  };
  L.approveVersion = function (state, estimateId, v) {
    var est = find(state.estimates, estimateId); var ver = est && est.versions[v - 1]; if (!ver) return { ok: false };
    est.versions.forEach(function (x) { if (x.status === 'approved' && x.v !== v) x.status = 'superseded'; });
    ver.status = 'approved'; ver.approvedAt = PV.now();
    var p = find(state.projects, est.projectId);
    if (p) { p.contract.approvedValue = ver.totals.sell; if (!p.contract.originalEstimate) p.contract.originalEstimate = ver.totals.sell; }
    L.log(state, 'estimate', 'Approved estimate v' + v + (p ? ' — ' + p.name : ''), est.id);
    return { ok: true };
  };

  // ---------- Material list / inventory ----------
  L.buildMaterialList = function (state, projectId) {
    var p = find(state.projects, projectId); var est = p && p.estimateId && find(state.estimates, p.estimateId);
    var ver = est && (L.approvedVersion(est) || L.currentVersion(est));
    if (!ver) return { ok: false, count: 0 };
    var byKey = {};
    ver.lines.forEach(function (l) {
      if (!l.productId && !l.rateId) return;
      var key = l.productId || l.rateId;
      var qty = (+l.qty || 0) * (1 + (l.wastePct || 0) / 100);
      if (!byKey[key]) byKey[key] = { id: PV.uid('ml'), productId: l.productId || null, rateId: l.rateId || null, label: l.label, qty: 0, unit: l.unit, reserved: false, poId: null, received: 0 };
      byKey[key].qty = round2(byKey[key].qty + qty);
    });
    var list = Object.keys(byKey).map(function (k) { return byKey[k]; }).filter(function (m) { return m.productId; });
    // keep manual edits already on the project; replace generated lines
    p.materials = p.materials.filter(function (m) { return m.manual; }).concat(list);
    return { ok: true, count: list.length };
  };

  L.inventoryFor = function (state, productId, locationId) {
    return state.inventory.filter(function (i) { return i.productId === productId && (!locationId || i.locationId === locationId); });
  };
  L.available = function (inv) { return round2((+inv.qty || 0) - sum(inv.reserved || [], function (r) { return +r.qty || 0; })); };

  L.reserve = function (state, projectId, productId, qty, locationId) {
    var invs = L.inventoryFor(state, productId, locationId); if (!invs.length) return { ok: false, error: 'no inventory record' };
    var inv = invs[0]; var avail = L.available(inv);
    if (qty > avail + 1e-9) return { ok: false, error: 'only ' + avail + ' ' + inv.unit + ' available', available: avail };
    inv.reserved = inv.reserved || []; inv.reserved.push({ projectId: projectId, qty: qty, ts: PV.now() });
    var p = find(state.projects, projectId); if (p) p.materials.forEach(function (m) { if (m.productId === productId) m.reserved = true; });
    return { ok: true, available: L.available(inv) };
  };
  L.releaseReservations = function (state, projectId) {
    state.inventory.forEach(function (inv) { inv.reserved = (inv.reserved || []).filter(function (r) { return r.projectId !== projectId; }); });
  };
  L.consume = function (state, projectId, productId, qty, locationId) {

    var inv = invs[0]; inv.qty = round2(inv.qty - qty);
    var left = qty;
    inv.reserved = (inv.reserved || []).map(function (r) {
      if (r.projectId !== projectId || left <= 0) return r;
      var take = Math.min(r.qty, left); left -= take; return Object.assign({}, r, { qty: round2(r.qty - take) });
    }).filter(function (r) { return r.qty > 0; });
    var p = find(state.projects, projectId); var prod = find(state.products, productId);
    if (p) {
      p.actuals.quantities[productId] = round2((p.actuals.quantities[productId] || 0) + qty);
      if (prod) p.actuals.materialCost = round2(p.actuals.materialCost + qty * (+prod.wholesaleCost || 0));
    }
    return { ok: true, onHand: inv.qty };
  };
  L.reorderAlerts = function (state) {
    return state.inventory.filter(function (inv) { return inv.reorderPoint != null && L.available(inv) <= inv.reorderPoint; });
  };

  // ---------- PAVORA ledger (until NUMORA) ----------
  L.addInvoice = function (state, projectId, inv) {
    var p = find(state.projects, projectId); if (!p) return null;
    var n = state.projects.reduce(function (a, x) { return a + x.ledger.invoices.length; }, 0) + 1;
    var r = Object.assign({ id: PV.uid('in'), number: 'INV-' + String(n).padStart(4, '0'), amount: 0, issuedAt: PV.now(), dueAt: null, memo: '', status: 'open' }, inv || {});
    p.ledger.invoices.push(r); L.log(state, 'invoice', r.number + ' $' + r.amount + ' — ' + p.name, p.id); return r;
  };
  L.addPayment = function (state, projectId, pay) {
    var p = find(state.projects, projectId); if (!p) return null;
    var r = Object.assign({ id: PV.uid('py'), amount: 0, receivedAt: PV.now(), method: '', invoiceId: null }, pay || {});
    p.ledger.payments.push(r);
    var inv = r.invoiceId && find(p.ledger.invoices, r.invoiceId);
    if (inv) { var paid = sum(p.ledger.payments.filter(function (x) { return x.invoiceId === inv.id; }), function (x) { return +x.amount; }); if (paid >= inv.amount - 0.005) inv.status = 'paid'; }
    L.log(state, 'payment', '$' + r.amount + ' received — ' + p.name, p.id); return r;
  };
  L.addExpense = function (state, projectId, ex) {
    var p = find(state.projects, projectId); if (!p) return null;
    var r = Object.assign({ id: PV.uid('ex'), amount: 0, kind: 'other', at: PV.now(), memo: '' }, ex || {});
    p.ledger.expenses.push(r);
    if (r.kind === 'labor') { p.actuals.laborCost = round2(p.actuals.laborCost + +r.amount); if (r.hours) p.actuals.laborHours = round2(p.actuals.laborHours + +r.hours); }
    else if (r.kind === 'material') p.actuals.materialCost = round2(p.actuals.materialCost + +r.amount);
    return r;
  };

  // Live profitability. `source` tells the UI where figures came from.
  L.profitability = function (state, projectId, numora) {
    var p = find(state.projects, projectId); if (!p) return null;
    var est = p.estimateId && find(state.estimates, p.estimateId);
    var ver = est && (L.approvedVersion(est) || L.currentVersion(est));
    var estMat = ver ? ver.totals.material : 0, estLab = ver ? ver.totals.labor : 0;
    var cos = sum(p.contract.changeOrders, function (c) { return c.approved ? +c.amount : 0; });
    var fin = numora && numora.ok ? numora : null;
    var invoiced = fin ? fin.invoiced : sum(p.ledger.invoices, function (i) { return +i.amount; });
    var collected = fin ? fin.collected : sum(p.ledger.payments, function (i) { return +i.amount; });
    var actMat = fin ? fin.actualMaterial : p.actuals.materialCost;
    var actLab = fin ? fin.actualLabor : p.actuals.laborCost;
    var other = fin ? fin.otherExpense : sum(p.ledger.expenses.filter(function (e) { return e.kind === 'other'; }), function (e) { return +e.amount; });

    var stage = L.stage(state, p.stageId); var done = stage && (stage.kind === 'closing' || stage.kind === 'closed');
    var fcMat = done ? actMat : Math.max(estMat, actMat), fcLab = done ? actLab : Math.max(estLab, actLab);

    var gp = round2(revised - fcCost);
    return {
      source: fin ? 'numora' : 'pavora_ledger',
      originalEstimate: p.contract.originalEstimate || 0, approvedValue: p.contract.approvedValue || 0, changeOrders: round2(cos), revisedValue: round2(revised),
      estMaterial: estMat, actMaterial: round2(actMat), estLabor: estLab, actLabor: round2(actLab), otherExpense: round2(other),
      invoiced: round2(invoiced), collected: round2(collected), outstanding: round2(invoiced - collected),
      forecastCost: fcCost, forecastGP: gp, marginPct: revised ? round2(gp / revised * 100) : 0
    };
  };

  // ---------- Learning records (estimate vs actual) ----------
  L.closeoutRecords = function (state, projectId) {
    var p = find(state.projects, projectId); var est = p && p.estimateId && find(state.estimates, p.estimateId);
    var ver = est && (L.approvedVersion(est) || L.currentVersion(est)); if (!ver) return [];
    return ver.lines.filter(function (l) { return l.productId && p.actuals.quantities[l.productId] != null; }).map(function (l) {
      var actual = p.actuals.quantities[l.productId]; var estq = +l.qty * (1 + (l.wastePct || 0) / 100);
      return { project_id: p.id, svc: l.rateId || 'material', unit: l.unit, ai_qty: round2(estq), corrected_qty: round2(actual),
        delta_pct: estq ? round2((actual - estq) / estq * 100) : 0, kind: 'actual_vs_estimate', source: 'pavora', ts: PV.now(), reason: 'unknown' };
    });
  };

  // ---------- Dashboard ----------
  L.metrics = function (state) {
    var byKind = {}; state.stages.forEach(function (s) { byKind[s.id] = s.kind; });
    var now = new Date(); var m0 = new Date(now.getFullYear(), now.getMonth(), 1).toISOString();
    var activeLeads = state.projects.filter(function (p) { return byKind[p.stageId] === 'lead'; }).length;
    var pendingEst = state.projects.filter(function (p) { return byKind[p.stageId] === 'estimate'; }).length;
    var openProjects = state.projects.filter(function (p) { return byKind[p.stageId] === 'won'; }).length;
    var upcoming = state.projects.filter(function (p) { return p.installDate && p.installDate >= now.toISOString().slice(0, 10) && byKind[p.stageId] === 'won'; })
      .sort(function (a, b) { return a.installDate < b.installDate ? -1 : 1; });
    var openPOs = state.purchaseOrders.filter(function (po) { return po.status !== 'received' && po.status !== 'closed'; }).length;
    var alerts = L.reorderAlerts(state).length;
    var estById = {}; state.estimates.forEach(function (e) { estById[e.id] = e; });

/* DEMEX Core client — the only place PAVORA talks to the backend.

(function (root) {
  var PV = root.PV = root.PV || {};
  var base = '';   // same-origin; the bridge never sends CORS headers

  function j(r) { return r.json().catch(function () { return { ok: false, error: 'bad json' }; }); }

  var C = PV.core = {
    token: function () { return fetch(base + '/api/token').then(j).then(function (d) { return d && d.token || ''; }).catch(function () { return ''; }); },

    health: function () { return fetch(base + '/api/health').then(j).catch(function () { return { ok: false }; }); },

    // {ok, server, org, name, apps}. On the real bridge `org` comes from the session cookie.
    me: function () { return fetch(base + '/api/me').then(j).catch(function () { return { ok: false }; }); },

    stateGet: function (app) {
      return fetch(base + '/api/state?app=' + encodeURIComponent(app)).then(j);
    },
    statePut: function (app, data, version) {
      return C.token().then(function (t) {
        return fetch(base + '/api/state', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-DEMEX-Token': t },
          body: JSON.stringify({ app: app, data: data, version: version }) });
      }).then(function (r) { return j(r).then(function (d) { d.http = r.status; return d; }); });
    },

      }).then(function (r) { return j(r).then(function (d) { d.http = r.status; return d; }); });
    },

    // Learning engine: POST /api/corrections (exists on the bridge; dev server accepts and stores it).
    corrections: function (rows) {
      return C.token().then(function (t) {
        return fetch(base + '/api/corrections', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-DEMEX-Token': t },
          body: JSON.stringify({ corrections: rows }) });
      }).then(function (r) { return j(r).then(function (d) { d.http = r.status; return d; }); });
    }
  };
})(typeof window !== 'undefined' ? window : globalThis);

(function (root) {
  var PV = root.PV = root.PV || {};

  var Estimatio = PV.estimatio = {

        if (!d || d.ok === false) return { status: 'error', error: d && d.error };

      }).catch(function (e) { return { status: 'not_connected', error: String(e) }; });
    },

    // Flooring projects in Estimatio for this workspace.
    pull: function () {
      return PV.core.stateGet('estimatio').then(function (d) {
        var ps = d && d.payload && Array.isArray(d.payload.projects) ? d.payload.projects : [];
        return ps.filter(function (p) { return p.trade === 'flooring' || p.trade === 'both'; }).map(Estimatio.toVersion);
      });
    },

    // Map one Estimatio project -> PAVORA version draft (see contracts §2).
    toVersion: function (ep) {
      var lines = (ep.estQty || []).map(function (l) {
        return { rateId: l.svc, label: Estimatio.rateLabel(l.svc), qty: +l.qty || 0, unit: l.unit || 'SF', laborRate: +l.rate || 0, materialUnitCost: +l.mat || 0, markupPct: 0, wastePct: 0, productId: null };
      });

      var statusMap = { draft: 'draft', sent: 'proposed', won: 'approved', lost: 'rejected' };
      return { estimatioId: ep.id, name: ep.name || '(untitled)', client: ep.client || {}, address: ep.address || '', scope: ep.scope || '',
        savedAt: e.savedAt || ep.createdAt || null, status: statusMap[ep.status] || 'draft', lines: lines,
        totals: { direct: +e.direct || 0, overhead: +e.oh || 0, profit: +e.profit || 0, sell: +e.sell || 0 }, pavoraProjectId: ep.pavoraProjectId || null };
    },
    rateLabel: function (id) { var r = L.find(PV.FLOORING_RATES, id); return r ? r.label : id; },

    // Apply a pulled Estimatio record to a PAVORA project as a NEW version. Never overwrites an approved one.
    importInto: function (state, projectId, rec) {
      var p = L.find(state.projects, projectId); if (!p) return { ok: false, error: 'project not found' };
      var est = p.estimateId ? L.find(state.estimates, p.estimateId) : L.createEstimate(state, projectId);
      var dup = est.versions.some(function (v) { return v.source && v.source.estimatioId === rec.estimatioId && v.source.savedAt === rec.savedAt; });

      if (rec.totals.sell) ver.totals = Object.assign(ver.totals, { direct: rec.totals.direct, overhead: rec.totals.overhead, profit: rec.totals.profit, sell: rec.totals.sell });

        if (blob.projects.some(function (x) { return x.pavoraProjectId === p.id; })) return { ok: true, skipped: true, reason: 'already in Estimatio' };
        var es = { id: PV.uid('es'), ws: state.companyId, name: p.name, client: { name: c.name || '', contact: '', email: c.email || '', phone: c.phone || '' },
          address: prop ? prop.address : '', trade: 'flooring', scope: p.notes || '', dueAt: '', status: 'draft', bidNo: '', estQty: [], estimate: null,
          proposal: { intro: '', inclusions: '', exclusions: '', notes: '' }, createdAt: PV.now(), demexSentAt: null, corrections: [], chat: [], pavoraProjectId: p.id };
        blob.projects.push(es);
        return PV.core.statePut('estimatio', blob, d.version || 0).then(function (r) {

    submit: function (state, rows) {

})(typeof window !== 'undefined' ? window : globalThis);

<script>/* js/data/store.js */
/* Store: loads this company's PAVORA state from DEMEX Core, enforces company isolation, saves with versioning. */
(function (root) {
  var PV = root.PV = root.PV || {};
  var APP = 'pavora';

  var S = PV.store = {
    state: null, rev: 0, version: 0, org: null, orgName: '', server: false, listeners: [], saving: false, dirty: false, lastError: null, lastSavedAt: null,

    subscribe: function (fn) { S.listeners.push(fn); return function () { S.listeners = S.listeners.filter(function (x) { return x !== fn; }); }; },
    emit: function () { S.rev++; S.listeners.forEach(function (fn) { try { fn(S.state); } catch (e) { console.error(e); } }); },

    // Sign-in context comes from the bridge (/api/me). The dev server returns the org it was started with.
    init: function () {
      return PV.core.me().then(function (me) {
        if (!me || me.ok === false || !me.org) throw new Error('Not signed in to DEMEX Core (/api/me failed)');
        S.org = me.org; S.orgName = me.name || me.org; S.server = !!me.server;
        return PV.core.stateGet(APP);
      }).then(function (d) {
        if (!d || d.ok === false) throw new Error((d && d.error) || 'Could not load state');
        S.version = d.version || 0;
        if (d.payload) {
          if (d.payload.companyId && d.payload.companyId !== S.org) {
            // Isolation guard: the bridge should make this impossible; refuse anyway.
            throw new Error('State belongs to company "' + d.payload.companyId + '" but you are signed in as "' + S.org + '". Refusing to load.');
          }
          S.state = PV.migrate(d.payload); S.state.companyId = S.org;
        } else {
          S.state = PV.emptyState(S.org, S.orgName);
        }
        S.emit(); return S.state;
      });
    },

    // Apply a mutation and persist. On a version conflict, reload and re-apply once.
    commit: function (fn, label) {
      var result = fn(S.state);
      S.state.meta.updatedAt = PV.now(); S.dirty = true; S.emit();
      S.flush(fn);
      return result;
    },

    flush: function (fn) {
      if (S.saving) { S.pending = true; return; }
      S.saving = true;
      PV.core.statePut(APP, S.state, S.version).then(function (r) {
        S.saving = false;
        if (r && r.ok) { S.version = r.version; S.dirty = false; S.lastError = null; S.lastSavedAt = PV.now(); }
        else if (r && r.http === 409) {
          // Another device saved first. Reload their copy, re-apply this mutation on top, save again.
          return PV.core.stateGet(APP).then(function (d) {
            S.version = d.version || 0; S.state = PV.migrate(d.payload) || S.state;
            if (fn) { try { fn(S.state); } catch (e) { S.lastError = 'conflict re-apply failed: ' + e.message; } }
            S.emit(); return S.flush();
          });
        } else { S.lastError = (r && r.error) || 'save failed'; }
        if (S.pending) { S.pending = false; S.flush(); }
        S.emit();
      }).catch(function (e) { S.saving = false; S.lastError = String(e); S.emit(); });
    },

    reload: function () { return PV.core.stateGet(APP).then(function (d) { if (d && d.ok && d.payload) { S.version = d.version; S.state = PV.migrate(d.payload); S.emit(); } return S.state; }); },

    exportJSON: function () { return JSON.stringify(S.state, null, 1); }
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>

<script>/* js/ui/common.js */
/* Shared UI helpers (React.createElement, no JSX). */
(function (root) {
  var PV = root.PV; var R = root.React; var h = R.createElement;
  var U = PV.ui = { h: h };

  U.money = function (n, d) { if (n === null || n === undefined || isNaN(n)) return '—'; return (n < 0 ? '-$' : '$') + Math.abs(n).toLocaleString(undefined, { minimumFractionDigits: d == null ? 0 : d, maximumFractionDigits: d == null ? 0 : d }); };
  U.money2 = function (n) { return U.money(n, 2); };
  U.date = function (s) { if (!s) return '—'; var d = new Date(s); return isNaN(d) ? s : d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }); };
  U.ago = function (s) { if (!s) return ''; var m = (Date.now() - new Date(s).getTime()) / 6e4; if (m < 1) return 'just now'; if (m < 60) return Math.round(m) + 'm ago'; if (m < 1440) return Math.round(m / 60) + 'h ago'; return Math.round(m / 1440) + 'd ago'; };
  U.today = function () { return new Date().toISOString().slice(0, 10); };
  U.cls = function () { return Array.prototype.slice.call(arguments).filter(Boolean).join(' '); };

  // ---- store hook
  U.useStore = function () {
    var st = R.useState(0); var tick = st[1];
    R.useEffect(function () { return PV.store.subscribe(function () { tick(function (x) { return x + 1; }); }); }, []);
    return PV.store.state;
  };
  U.commit = function (fn) { return PV.store.commit(fn); };
  // Derived values (metrics, recommendations…) computed once per store change, shared by every component that asks.
  var memo = { rev: -1, v: {} };
  U.derived = function (key, fn) {
    if (memo.rev !== PV.store.rev) memo = { rev: PV.store.rev, v: {} };
    if (!(key in memo.v)) memo.v[key] = fn(PV.store.state);
    return memo.v[key];
  };
  U.metrics = function () { return U.derived('metrics', PV.logic.metrics); };

  // ---- toasts
  var toastListeners = [];
  U.toast = function (text, kind) { toastListeners.forEach(function (f) { f({ id: PV.uid('t'), text: text, kind: kind || 'ok' }); }); };
  U.Toasts = function () {
    var st = R.useState([]); var list = st[0], set = st[1];
    R.useEffect(function () { var f = function (t) { set(function (l) { return l.concat([t]); }); setTimeout(function () { set(function (l) { return l.filter(function (x) { return x.id !== t.id; }); }); }, 4200); }; toastListeners.push(f); return function () { toastListeners = toastListeners.filter(function (x) { return x !== f; }); }; }, []);
    return h('div', { className: 'toasts' }, list.map(function (t) { return h('div', { key: t.id, className: 'toast ' + t.kind }, t.text); }));
  };

  // ---- primitives
  U.Field = function (p) { return h('div', null, h('label', { className: 'f' }, p.label), p.children); };
  U.Input = function (p) { return h('input', Object.assign({}, p, { onChange: function (e) { p.onChange(e.target.value); } })); };
  U.Num = function (p) { return h('input', Object.assign({ type: 'number', step: p.step || 'any' }, p, { value: p.value == null ? '' : p.value, onChange: function (e) { p.onChange(e.target.value === '' ? null : +e.target.value); } })); };
  U.Select = function (p) { return h('select', { value: p.value == null ? '' : p.value, onChange: function (e) { p.onChange(e.target.value); }, disabled: p.disabled }, (p.placeholder ? [h('option', { key: '', value: '' }, p.placeholder)] : []).concat(p.options.map(function (o) { return h('option', { key: o.value, value: o.value }, o.label); }))); };
  U.Textarea = function (p) { return h('textarea', Object.assign({}, p, { onChange: function (e) { p.onChange(e.target.value); } })); };
  U.Pill = function (p) { return h('span', { className: 'pill ' + (p.kind || '') }, p.children); };
  U.Empty = function (p) { return h('div', { className: 'empty' }, p.children); };
  U.KPI = function (p) {
    var go = p.to ? function () { U.go(p.to); } : null;
    return h('div', { className: U.cls('card kpi', p.tone, go && 'click'), onClick: go, role: go ? 'link' : null, tabIndex: go ? 0 : null, onKeyDown: go ? function (e) { if (e.key === 'Enter') go(); } : null },
      h('div', { className: 'l' }, p.label), h('div', { className: 'v' }, p.value), p.hint ? h('div', { className: 'h' }, p.hint) : null);
  };

  U.Modal = function (p) {
    R.useEffect(function () { var k = function (e) { if (e.key === 'Escape') p.onClose(); }; window.addEventListener('keydown', k); return function () { window.removeEventListener('keydown', k); }; }, []);
    return h('div', { className: 'modal-bg', onMouseDown: function (e) { if (e.target === e.currentTarget) p.onClose(); } },
      h('div', { className: U.cls('modal', p.wide && 'wide') }, h('h2', null, p.title), p.children,
        p.actions ? h('div', { className: 'actions' }, p.actions) : null));
  };

  U.Tabs = function (p) { return h('div', { className: 'tabs' }, p.tabs.map(function (t) { return h('button', { key: t.id, className: p.value === t.id ? 'on' : '', onClick: function () { p.onChange(t.id); } }, t.label); })); };

  U.Table = function (p) {
    return h('table', { className: 'tbl' }, h('thead', null, h('tr', null, p.cols.map(function (c, i) { return h('th', { key: i, className: c.r ? 'r' : '' }, c.label); }))),
      h('tbody', null, p.rows.length ? p.rows.map(function (r, i) {
        return h('tr', { key: r.id || i, className: p.onRow ? 'click' : '', onClick: p.onRow ? function () { p.onRow(r); } : null }, p.cols.map(function (c, j) { return h('td', { key: j, className: c.r ? 'r' : '' }, c.render ? c.render(r) : r[c.key]); }));
      }) : h('tr', null, h('td', { colSpan: p.cols.length }, h('div', { className: 'empty' }, p.empty || 'Nothing here yet.')))));
  };

  // Confirm dialog as a hook: const ask = U.useConfirm(); ask('Delete?', fn)
  U.useConfirm = function () {
    var st = R.useState(null); var q = st[0], set = st[1];
    var ask = function (text, fn) { set({ text: text, fn: fn }); };
    ask.el = q ? h(U.Modal, { title: 'Please confirm', onClose: function () { set(null); }, actions: [h('button', { key: 'c', className: 'btn', onClick: function () { set(null); } }, 'Cancel'), h('button', { key: 'o', className: 'btn danger', onClick: function () { var f = q.fn; set(null); f(); } }, 'Confirm')] }, h('p', null, q.text)) : null;
    return ask;
  };

  U.ThemeToggle = function () { var st = R.useState(PV.themePref()); var set = function (t) { PV.applyTheme(t); st[1](t); }; return h('div', { className: 'theme', title: 'Theme (saved on this computer)' }, ['light', 'dark', 'system'].map(function (t) { return h('button', { key: t, className: st[0] === t ? 'on' : '', onClick: function () { set(t); } }, t === 'light' ? '☀ Light' : t === 'dark' ? '☾ Dark' : 'Auto'); })); };

  U.stageKind = function (state, id) { var s = PV.logic.stage(state, id); return s ? s.kind : ''; };
  U.stageLabel = function (state, id) { var s = PV.logic.stage(state, id); return s ? s.label : id; };
  U.custName = function (state, id) { var c = PV.logic.find(state.customers, id); return c ? c.name : '—'; };
  U.repName = function (state, id) { var u = PV.logic.find(state.users, id); return u ? u.name : '—'; };
  U.go = function (route) { location.hash = '#/' + route; };
})(window);

</script>
<script>/* js/ui/dashboard.js */
(function (root) {
  var PV = root.PV, U = PV.ui, h = U.h, L = PV.logic, R = root.React;

  // Everything the dashboard shows, derived in one pass per store change (see U.derived).
  function dashData(s) {
    var m = U.metrics();
    var kindOf = {}; s.stages.forEach(function (st) { kindOf[st.id] = st.kind; });
    var perStage = {}; var openValue = 0; var profitRows = [];
    s.projects.forEach(function (p) {
      perStage[p.stageId] = (perStage[p.stageId] || 0) + 1;
      var k = kindOf[p.stageId];
      if (k === 'won') openValue += p.contract.approvedValue || 0;
      if ((k === 'won' || k === 'closing') && p.contract.approvedValue) profitRows.push({ p: p, pr: L.profitability(s, p.id, null) });
    });
    // Thinnest margins first: those are the jobs that need attention.
    profitRows.sort(function (a, b) { return a.pr.marginPct - b.pr.marginPct; });
    return { m: m, recs: L.recommendations(s, m), perStage: perStage, openValue: openValue, profitRows: profitRows.slice(0, 6), profitTotal: profitRows.length };
  }

  U.Dashboard = function () {
    var s = U.useStore(); var d = U.derived('dashboard', dashData); var m = d.m, recs = d.recs;
    var est = PV.store.estimatioStatus;

    return h('div', null,
      h('div', { className: 'grid g4' },
        h(U.KPI, { label: 'Active leads', value: m.activeLeads, to: 'pipeline' }),
        h(U.KPI, { label: 'Pending estimates', value: m.pendingEstimates, tone: m.pendingEstimates ? 'warn' : '', to: 'estimates' }),
        h(U.KPI, { label: 'Open projects', value: m.openProjects, hint: U.money(d.openValue) + ' under contract', to: 'projects' }),
        h(U.KPI, { label: 'Upcoming installs', value: m.upcomingInstalls.length, hint: m.upcomingInstalls[0] ? 'Next: ' + U.date(m.upcomingInstalls[0].installDate) : '', to: 'installations' }),
        h(U.KPI, { label: 'Outstanding orders', value: m.openPOs, to: 'purchasing' }),
        h(U.KPI, { label: 'Inventory alerts', value: m.inventoryAlerts, tone: m.inventoryAlerts ? 'warn' : '', to: 'inventory' }),
        h(U.KPI, { label: 'Sales this month', value: U.money(m.monthlySales), tone: 'good', hint: 'approved estimates', to: 'financials' }),
