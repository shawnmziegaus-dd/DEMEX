<style>
/* Estimatio brand tokens (brand_tokens.json / BRAND_GUIDELINES.md): deep obsidian canvas, carbon slate

:root{

  color-scheme:dark;
}
html,body{height:100%;}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45;
  padding:0;}
*{box-sizing:border-box;}

input,select,textarea{font:inherit;color:var(--fg);background:var(--panel2);border:1px solid var(--line);border-radius:var(--r-md);padding:8px 10px;min-width:0;width:100%;}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--blue);outline-offset:1px;}

.num{font-family:var(--mono);font-variant-numeric:tabular-nums;}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:10px 0;flex-wrap:wrap;}
.brand{font-family:var(--display);font-weight:600;font-size:22px;letter-spacing:-.02em;display:flex;align-items:center;gap:9px;color:#fff;text-decoration:none;}

.ai{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--fg2);} .ai i{width:8px;height:8px;border-radius:50%;background:var(--blue);box-shadow:0 0 10px var(--blue);} .ai.off i{background:var(--fg3);box-shadow:none;}
nav{display:flex;gap:4px;flex-wrap:wrap;}
nav button{background:none;border:0;padding:7px 11px;border-radius:6px;color:var(--fg2);cursor:pointer;font-weight:500;}

.spacer{flex:1;}
.pill{font-size:11px;padding:3px 8px;border-radius:999px;border:1px solid var(--line2);color:var(--fg2);white-space:nowrap;}
.pill.ok{border-color:var(--green);color:var(--green);} .pill.warn{border-color:var(--amber);color:var(--amber);} .pill.err{border-color:var(--red);color:var(--red);}
main{padding-block:18px 48px;max-width:1240px;margin:0 auto;}
h1{font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:-.02em;margin:0 0 4px;text-wrap:balance;}

.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg3);font-weight:600;}
.muted{color:var(--fg2);} .dim{color:var(--fg3);}

.btn:hover{background:var(--line);} .btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 0 0 0 var(--glow);} .btn.primary:hover{background:var(--blue2);box-shadow:0 0 18px var(--glow);}

.btn.danger{border-color:var(--red);color:var(--red);}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;min-width:0;box-shadow:var(--shadow-card);}
.grid{display:grid;gap:14px;} .g2{grid-template-columns:1fr 1fr;} .g3{grid-template-columns:repeat(3,1fr);} .g4{grid-template-columns:repeat(4,1fr);}

.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.field label{display:block;font-size:12px;color:var(--fg2);margin-bottom:4px;}
table{width:100%;border-collapse:collapse;} th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg3);padding:8px 8px;border-bottom:1px solid var(--line);} td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle;}

.tablewrap{overflow-x:auto;}

.list{display:flex;flex-direction:column;gap:8px;}

.trade.flooring{background:rgba(42,209,184,.15);color:var(--teal);} .trade.demolition{background:rgba(255,92,92,.15);color:var(--red);} .trade.both{background:rgba(59,139,255,.15);color:var(--blue2);}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--panel2);border:1px solid var(--line2);padding:10px 14px;border-radius:8px;z-index:20;box-shadow:0 8px 30px rgba(0,0,0,.4);max-width:90vw;}
.toast.err{border-color:var(--red);} .toast.ok{border-color:var(--green);}
.empty{padding:40px 20px;text-align:center;color:var(--fg2);border:1px dashed var(--line2);border-radius:10px;}
.empty b{display:block;color:var(--fg);font-family:var(--display);font-size:16px;margin-bottom:6px;}
.sheet td input{padding:5px 7px;} .sheet td select{padding:5px 7px;}
.total{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);} .total.big{border-top:2px solid var(--line2);border-bottom:0;margin-top:6px;padding-top:12px;font:600 18px var(--display);}
.prop{background:#fff;color:#111;border-radius:8px;padding:28px;font-family:Georgia,serif;max-width:820px;margin:0 auto;overflow:auto;}
.prop h3{margin:0;font-size:20px;} .prop table{color:#111;} .prop th{color:#555;border-bottom:1px solid #ccc;} .prop td{border-bottom:1px solid #eee;}
.prop .ph{display:flex;justify-content:space-between;gap:20px;border-bottom:2px solid #111;padding-bottom:10px;margin-bottom:14px;flex-wrap:wrap;}
.hero{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;background:linear-gradient(135deg,#141C28 0%,#0F1A2B 60%,#0B111A 100%);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;box-shadow:var(--shadow-card);position:relative;overflow:hidden;}
.hero::after{content:"";position:absolute;inset:auto -80px -120px auto;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,var(--glow),transparent 70%);pointer-events:none;}
.hero img{width:112px;height:112px;border-radius:22%;filter:drop-shadow(0 0 18px rgba(10,132,255,.35));}
.hero h1{font-size:26px;margin:0;} .hero p{margin:4px 0 0;color:var(--fg2);}
.dash2{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);} .prop2{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);}
@media (max-width:760px){.hero{grid-template-columns:1fr;} .hero img{width:84px;height:84px;} .dash2,.prop2{grid-template-columns:1fr;}}
.chart{width:100%;height:auto;display:block;} .chart text{font-family:var(--body);fill:var(--fg2);font-size:11px;} .chart .lbl{fill:var(--fg);font-weight:600;}

.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--fg2);} .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;}

.chat{display:flex;flex-direction:column;min-height:520px;} .msgs{flex:1;overflow-y:auto;max-height:560px;display:flex;flex-direction:column;gap:10px;padding:4px 2px;}
.msg{display:flex;flex-direction:column;max-width:88%;} .msg.user{align-self:flex-end;align-items:flex-end;} .msg .bubble{padding:9px 12px;border-radius:12px;white-space:pre-wrap;line-height:1.45;} .msg.user .bubble{background:var(--deep);color:#fff;} .msg.assistant .bubble{background:var(--panel2);border:1px solid var(--line);}

.pd-draw{stroke-dasharray:1;stroke-dashoffset:1;animation:pddraw 1.1s cubic-bezier(.5,0,.2,1) forwards;}
.pd-fill{animation:pdfade .8s ease .35s both;}
.pd-pop{transform-box:fill-box;transform-origin:center;animation:pdpop .45s cubic-bezier(.3,1.6,.5,1) both;}
@keyframes pddraw{to{stroke-dashoffset:0}} @keyframes pdfade{from{fill-opacity:0}} @keyframes pdpop{from{transform:scale(0)}}
.pd-ov{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--panel2);border:1px solid var(--line2);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow-card);min-width:240px;max-width:86%;font-size:13px;}
.pd-ov.top{top:24px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;white-space:nowrap;}
.pd-bar{height:6px;border-radius:3px;background:var(--panel);overflow:hidden;margin-top:12px;} .pd-bar i{display:block;height:100%;background:var(--blue);transform-origin:left;animation:pdbar 2.2s ease forwards;}
@keyframes pdbar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.pd-pill{position:absolute;right:24px;bottom:24px;background:var(--blue);color:#fff;border-radius:999px;padding:8px 14px;font:600 13px var(--mono);box-shadow:0 8px 24px rgba(10,132,255,.4);animation:pdpopc .5s both .6s;}
@keyframes pdpopc{from{opacity:0;transform:translateY(8px)}}
@media (max-width:900px){.pd,.pd.compact{grid-template-columns:1fr;} .pd-sheets{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);align-items:center;} .pd-sheets .pd-h{border:0;} .pd-sh{margin:6px 0 6px 6px;min-width:150px;} .pd-items{border-left:0;border-top:1px solid var(--line);} .pd-list{display:grid;grid-template-columns:1fr 1fr;} .pd-canvas{padding:8px;}}

/* AI demo */
.aid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:18px;text-align:left;}
.aid-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;}
.aid-scope{font-size:14.5px;line-height:1.8;color:var(--fg2);margin:0 0 16px;}
.aid-scope mark{background:transparent;color:inherit;border-radius:4px;padding:1px 2px;transition:background .4s,color .4s,box-shadow .4s;box-shadow:inset 0 -1px 0 rgba(138,153,173,.35);}
.aid-scope mark.on{color:#fff;}
.aid-row{display:grid;grid-template-columns:10px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);animation:fadeup2 .45s both;}

.aid-row b{font-size:13px;display:block;} .aid-row small{display:block;color:var(--fg3);font-size:11.5px;}
.tag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;letter-spacing:.04em;white-space:nowrap;}
.tag-ai{background:rgba(42,209,184,.15);color:var(--teal);} .tag-m{background:rgba(243,178,62,.15);color:var(--amber);}

/* Who we serve */
.who-tabs{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px;}
.who-tabs button{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:14px;border:1px solid var(--line2);background:var(--panel);color:var(--fg);cursor:pointer;font-weight:600;font-size:15px;transition:border-color .15s,background .15s;}
.who-tabs button small{color:var(--fg3);font-weight:500;font-size:12px;} .who-tabs button i{width:10px;height:10px;border-radius:3px;}
.who-tabs button[aria-selected="true"]{border-color:var(--c);background:rgba(255,255,255,.05);box-shadow:0 0 0 1px var(--c);}
.tx{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:20px;grid-auto-flow:row dense;}
.tt{position:relative;text-align:left;padding:20px 16px 16px;border-radius:14px;background:var(--panel);border:1px solid var(--line);cursor:pointer;overflow:hidden;transition:transform .18s,border-color .18s,box-shadow .18s;}
.tt::before{content:"";position:absolute;left:0;top:0;right:0;height:3px;background:var(--c);}
.tt:hover{transform:translateY(-3px);border-color:var(--line2);box-shadow:0 14px 30px rgba(0,0,0,.35);} .tt[aria-expanded="true"]{border-color:var(--c);}
.tt b{display:block;font-size:15px;margin-bottom:4px;} .tt small{display:block;color:var(--fg2);font-size:12.5px;line-height:1.5;}

.tt .more{display:block;margin-top:12px;font-size:12px;font-weight:600;color:var(--c);}
.txp{grid-column:1/-1;background:var(--bg);border:1px solid var(--line2);border-radius:14px;padding:6px 16px;animation:fadeup2 .3s both;}
/* How it works */
.how{display:grid;grid-template-columns:minmax(0,.75fr) minmax(0,1.6fr);gap:26px;margin-top:36px;align-items:start;}
.how-s{display:block;width:100%;text-align:left;padding:18px 18px 16px;border-radius:14px;border:1px solid var(--line);background:var(--panel);cursor:pointer;margin-bottom:10px;position:relative;overflow:hidden;}

.how-s .k{font:600 12px var(--mono);color:var(--blue2);} .how-s b{display:block;font-size:16px;margin:4px 0;} .how-s > span:not(.k):not(.pg){color:var(--fg2);font-size:13.5px;line-height:1.5;}

.eco-c b{display:block;font-size:18px;} .eco-c .role{display:block;color:var(--c);font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin:4px 0 8px;} .eco-c p{margin:0;color:var(--fg2);font-size:14px;line-height:1.55;}
.eco-c .here{position:absolute;top:16px;right:16px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:rgba(10,132,255,.18);color:var(--blue2);}
.eco-c .more{display:block;margin-top:14px;font-weight:600;font-size:13px;color:var(--c);}
.flow{padding:18px;border-radius:16px;background:var(--panel);border:1px solid var(--line);margin-top:30px;}

.plan:hover{transform:translateY(-4px);box-shadow:0 20px 50px rgba(0,0,0,.4);}

.plan .badge{position:absolute;top:-11px;left:24px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--blue);color:#fff;letter-spacing:.04em;}
.plan .badge.g{background:var(--green);color:#06210f;left:auto;right:24px;}
.plan h3{margin:0;font-size:20px;} .plan .pr{font:700 44px/1 var(--display);letter-spacing:-.03em;} .plan .pr small{font:500 14px var(--body);color:var(--fg2);letter-spacing:0;margin-left:6px;}

.plan .btn.lg{text-align:center;text-decoration:none;}

.sl{margin-bottom:18px;} .sl .row{justify-content:space-between;margin-bottom:8px;font-size:14px;flex-wrap:nowrap;} .sl output{font:600 13px var(--mono);color:#fff;background:var(--panel2);padding:3px 9px;border-radius:6px;white-space:nowrap;}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;padding:0;border:0;border-radius:3px;background:linear-gradient(90deg,var(--blue) var(--p),var(--panel2) var(--p));cursor:pointer;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;border:4px solid var(--blue);box-shadow:0 2px 8px rgba(0,0,0,.4);}

.res{position:sticky;top:90px;}
.res-big{font:700 52px/1 var(--display);letter-spacing:-.03em;margin:10px 0 4px;}
.bars{display:grid;gap:10px;margin:18px 0 6px;} .bars > div{display:grid;grid-template-columns:112px 1fr auto;gap:10px;align-items:center;font-size:13px;color:var(--fg2);}
.bars .b{height:12px;border-radius:6px;background:var(--panel2);overflow:hidden;} .bars .b i{display:block;height:100%;border-radius:6px;transition:width .5s cubic-bezier(.2,.7,.2,1);}
.cmp th,.cmp td{text-align:center;} .cmp th:first-child,.cmp td:first-child{text-align:left;} .cmp td{padding:12px 8px;} .cmp th{font-size:12px;}
.ck{color:var(--green);font-weight:700;}
.teaser{display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:center;}

function lineSell(l){ return lineTotal(l)*markupMult(); }
