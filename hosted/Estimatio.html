/* Estimate math: direct = Σ qty×(labor rate + material $/unit); OH on direct; profit on direct+OH; tax on materials (or all). */
function calc(p){
  var s=DB.settings, lines=(p.estQty||[]).filter(function(l){return l.svc&&+l.qty>0;});
